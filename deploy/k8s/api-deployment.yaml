# Designed deployment target, not exercised in this environment.
# Architecture note: In production on GKE, Redis (GCP Memorystore) and MongoDB
# (MongoDB Atlas) are consumed as managed services over VPC peering rather than
# in-cluster stateful sets.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: diffr-api
  labels:
    app.kubernetes.io/name: diffr
    app.kubernetes.io/component: api-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diffr-api
  template:
    metadata:
      labels:
        app: diffr-api
    spec:
      containers:
        - name: diffr-api
          image: diffr:latest
          imagePullPolicy: IfNotPresent
          command: ["diffr", "serve", "-addr", ":8080", "-static", "/app/web"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: diffr-config
                  key: redis_addr
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: diffr-secrets
                  key: mongo_uri
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: diffr-api-service
  labels:
    app.kubernetes.io/name: diffr
    app.kubernetes.io/component: api-dashboard
spec:
  type: ClusterIP
  selector:
    app: diffr-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http
      name: http
